image: outputs/viewpoint-sensitivity-upright/render/samples/9aecdbb725e84a1ab77642aa7767b383/a270.0_e0.0_o0.0.rgb.png
query: desk
output_dir: outputs/sam3d_correction
# Docker exposes all GPUs; each worker uses this host GPU index as cuda:0.
gpu_id: 3

preprocessing:
  checkpoint: /data/checkpoints/sam3/sam3.pt
  threshold: 0.3
  max_masks: 1
  # ApexNav's decision-frame depth is aligned with the 640x480 RGB image.
  # The simulator uses a 79-degree horizontal FOV.
  # depth: data/apexnav/replays/epi651_00803-k1cupFYWXJ6_8_couch/decision_frame_raw_depth.npy
  # intrinsics: [388.1910413097385, 422.0475153598262, 320.0, 240.0]

reconstruction:
  checkpoint_dir: /data/checkpoints/sam3d/hf
  views: 8
  resolution: 512
  seed: 42

visualization:
  # PNG views and turntable GIFs are always saved. Enable the browser viewer too.
  enabled: true
  host: 0.0.0.0
  port: 7860
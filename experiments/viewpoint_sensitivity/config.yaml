# Smoke configuration for the viewpoint-sensitivity experiment.
# A tiny 4x3 az/el grid with one object per category: enough to exercise the
# balanced render -> full-vocabulary query -> analyze path end to end.
# Check nvidia-smi and set gpu_id to a currently-idle GPU before running.
output_dir: ../../outputs/viewpoint-sensitivity-smoke
gpu_id: 3
# Objaverse slice as mounted read-only in the container.
root: /data/objaverse_nas
# Reuse the full canonical frame that already lives on the slice. If it is
# missing, run.py can regenerate it with --canonicalize.
canonical: /data/objaverse_nas/canonical.json
# Categories are both the render strata and the closed recognition vocabulary.
categories: [chair, sofa, table, bed, lamp]
objects_per_category: 1
azimuths: [0, 90, 180, 270]
elevations: [0, 30, 60]
distance: 2.2
image_size: 512
detection:
  # Operating point; raw scores are persisted per view so it can be re-swept
  # in analysis without re-running SAM3.
  score_threshold: 0.5
  iou_threshold: 0.5
sam3d_collection:
  # Copy every sampled object's RGB at the best/worst ranked viewpoints.
  viewpoints_per_band: 3
checkpoint: /data/checkpoints/sam3/sam3.pt

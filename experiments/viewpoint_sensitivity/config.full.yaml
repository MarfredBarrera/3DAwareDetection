# Full configuration for the viewpoint-sensitivity experiment.
# Paper-style 12x12 grid with 10 objects from every category.  Azimuth uses
# 30-degree bins.  Latitude uses 15-degree bin centers so all 144 camera poses
# are unique and the +/-90-degree look-at singularities are avoided.
output_dir: ../../outputs/viewpoint-sensitivity-full
gpu_id: 3
root: /data/objaverse_nas
canonical: /data/objaverse_nas/canonical.json
categories: [chair, sofa, table, bed, lamp, bookcase, desk, stool, cabinet, vase, toilet, bench]
objects_per_category: 10
azimuths: [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330]
elevations: [-82.5, -67.5, -52.5, -37.5, -22.5, -7.5, 7.5, 22.5, 37.5, 52.5, 67.5, 82.5]
distance: 2.2
image_size: 320
detection:
  score_threshold: 0.5
  iou_threshold: 0.5
sam3d_collection:
  viewpoints_per_band: 3
checkpoint: /data/checkpoints/sam3/sam3.pt

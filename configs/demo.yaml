# One-frame SAM3 mask -> SAM3D reconstruction and visualization.
# Supply a frame with `python main.py --image /path/to/frame.png --query chair`,
# or replace this placeholder. Paths are relative to this YAML file.
image: ../outputs/upright/renders/gt/samples/addb92302c0141f5b52b48b06e359f7c/a0.0_e0.0_o0.0.rgb.png
query: bench
output_dir: ../outputs/frame
gpu_id: 0

preprocessing:
  checkpoint: /data/checkpoints/sam3/sam3.pt
  threshold: 0.3
  max_masks: 1
  # Optional aligned depth and camera intrinsics:
  # depth: ../data/depth.npy
  # intrinsics: [fx, fy, cx, cy]

reconstruction:
  checkpoint_dir: /data/checkpoints/sam3d/hf
  views: 8
  resolution: 512
  seed: 42

visualization:
  enabled: true
  host: 0.0.0.0
  port: 7860

# Fast image-domain diagnostic before the 1920x1680 full Blender run finishes.
output_dir: ../outputs/viewactive/blender_pilot
gpu_id: 3
cohort:
  seen_classes: 12
  unseen_classes: 3
  per_class: 10
  total_seen: null
  unseen_per_class: 10
  oversample: 2.0
  exclude_uids_from: [../outputs/upright/canonical.json]
render:
  backend: blender
  width: 320
  height: 280
  distance: 1.4
  samples: 8
  shard_size: 10
train:
  epochs: 40

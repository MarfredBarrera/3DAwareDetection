# ViewActive reproduction at paper scale: 56 seen ImageNet-mappable LVIS
# classes (1,600 objects, split 70/5/25 by object) and 200 unseen-class objects,
# 132 views each (12 azimuths x 11 elevations). See README "ViewActive".
output_dir: ../outputs/viewactive/full
gpu_id: 3
cohort:
  seen_classes: 56
  unseen_classes: 10
  per_class: 29
  total_seen: 1600
  unseen_per_class: 20
  oversample: 2.0
  exclude_uids_from: [../outputs/upright/canonical.json]  # keep the viewpoint study's objects unseen

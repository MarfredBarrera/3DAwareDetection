# End-to-end check: 3 objects x 4 views, 8 candidates each. Minutes, not hours.
output_dir: ../outputs/smoke
gpu_id: 1

dataset:
  root: /data/objaverse_nas
  canonical: ../outputs/upright/canonical.json
  require_upright_verified: true
  categories: [chair, table, desk]
  objects_per_category: 1
  azimuths: [0, 90, 180, 270]
  elevations: [0, 30]
  image_size: 320

reconstruction:
  objects_per_category: 1
  input_elevations: [0, 30]
  candidate_azimuths: [0, 90, 180, 270]
  candidate_elevations: [0, 30]
  resolution: 320

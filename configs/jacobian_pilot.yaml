# Jacobian-uncertainty prototype: 5 upright objects (one per category), all 60
# ground-truth views as inputs, Gaussians saved for reconstruction/uncertainty.py.
# Check nvidia-smi and set gpu_id to an idle GPU before running.
output_dir: ../outputs/jacobian_pilot
gpu_id: 0

dataset:
  root: /data/objaverse_nas
  canonical: ../outputs/upright/canonical.json
  require_upright_verified: true
  categories: [chair, sofa, table, lamp, vase]
  objects_per_category: 1
  azimuths: [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330]
  elevations: [0, 15, 30, 45, 60]
  distance: 2.2
  image_size: 320

reconstruction:
  objects_per_category: 1
  input_elevations: null
  candidate_azimuths: [0, 45, 90, 135, 180, 225, 270, 315]
  candidate_elevations: [0, 30, 60]
  candidate_distance: 2.0
  resolution: 320
  seed: 42
  save_gaussians: true

ambiguity:
  visual_entropy: {bins: 32}
  self_occlusion: {samples: 20000, seed: 0}
  surface_normal_entropy: {samples: 20000, seed: 0, polar_bins: 9, azimuth_bins: 18}

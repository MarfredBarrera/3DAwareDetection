# SAM3/SAM3D viewpoint benchmark on ViewActive's 200 unseen-class objects.
# Imports completed Blender inputs by reference; rerun the render stage as
# blender_full finishes. The SAM3D work and detector results live in this
# separate output directory and resume after interruption.
output_dir: ../outputs/unseen_blender
gpu_id: 0

dataset:
  root: ../outputs/viewactive/blender_full/store
  canonical: ../outputs/viewactive/blender_full/canonical.json
  manifest: ../outputs/viewactive/blender_full/objects.json
  split: test_unseen
  source_run: ../outputs/viewactive/blender_full
  require_upright_verified: false
  categories: [balloon, bench, bowl, cat, dog, dresser, jeep, traffic_light,
               vending_machine, water_bottle]
  objects_per_category: 20
  azimuths: [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330]
  elevations: [0, 15, 30, 45, 60]
  distance: 1.4
  image_size: 1920  # Blender source width; source metadata stores 1920x1680.

detection:
  score_threshold: 0.5
  iou_threshold: 0.5

reconstruction:
  objects_per_category: 20
  input_elevations: null
  candidate_azimuths: [0, 45, 90, 135, 180, 225, 270, 315]
  candidate_elevations: [0, 30, 60]
  candidate_distance: 2.0
  resolution: 320
  seed: 42

ambiguity:
  visual_entropy: {bins: 32}
  self_occlusion: {samples: 20000, seed: 0}
  surface_normal_entropy: {samples: 20000, seed: 0, polar_bins: 9, azimuth_bins: 18}

analysis:
  primary_selector: ambiguity:combined
  figure_selectors: [identity, ambiguity:combined, detector_entropy,
                     detector_gap, oracle]
  combined_weights: null
